services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: itrigger-server
    expose:
      - "8080"
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

    networks:
      - web

networks:
  web:
    external: true